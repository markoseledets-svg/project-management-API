name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    name: Security & Dependency Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit (SCA)
        run: |
          pip-audit -r requirements.txt

      - name: Run Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten
        env:
          SEMGREP_RULES: "p/python p/security-audit"

  tests:
    name: Run Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ${{ secrets.CI_TEST_DB_PASSWORD }}
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:${{ secrets.CI_TEST_DB_PASSWORD }}@localhost:5432/test_db
      TEST_DATABASE_URL: postgresql+asyncpg://test_user:${{ secrets.CI_TEST_DB_PASSWORD }}@localhost:5432/test_db
      POOL_SIZE: 15
      POOL_OVERFLOW: 15
      POOL_TIMEOUT: 30

      REDIS_URL: redis://localhost:6379/0

      ACCESS_SECRET_KEY: ${{ secrets.CI_ACCESS_SECRET_KEY }}
      REFRESH_SECRET_KEY: ${{ secrets.CI_REFRESH_SECRET_KEY }}
      RESTORE_SECRET_KEY: ${{ secrets.CI_RESTORE_SECRET_KEY }}
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      SESSION_SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      ALGORITHM: HS256

      ENV: test
      CORS_ORIGINS: '["http://localhost", "http://localhost:8000"]'

      GOOGLE_CLIENT_ID: mock-google-client-id
      GOOGLE_CLIENT_SECRET: mock-google-client-secret
      GITHUB_CLIENT_ID: mock-github-client-id
      GITHUB_CLIENT_SECRET: mock-github-client-secret

      SMTP_KEY: mock-smtp-key
      SMTP_LOGIN: test@example.com
      SMTP_PORT: 587
      SMTP_SERVER: smtp.example.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest
        run: |
          pytest -v
